[master]
bind_addr = "0.0.0.0"
grpc_port = 50051
web_port = 8080
web_enabled = true
scheduler_interval_ms = 250
heartbeat_timeout_seconds = 6

[security]
allow_unsafe_commands = false
allow_root = false
allowed_commands = [
  "hostname",
  "uptime",
  "uname",
  "free",
  "df",
  "nproc",
  "lscpu",
  "echo",
  "seq",
  "sleep",
  "sensors",
  "ip",
  "ping",
  "whoami",
  "date"
]
