[package]
name = "aether"
version = "0.1.0"
edition = "2021"

[dependencies]
# Runtime assíncrono para operações concorrentes de rede, processos e telemetria.
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Stack gRPC e Protobuf.
tonic = "0.11"
prost = "0.12"

# Telemetria local de CPU, RAM e sensores térmicos.
sysinfo = "0.30"

# CLI, configuração e serialização.
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.8", features = ["v4"] }

# Web Control Plane.
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }

# Diagnóstico, erros e logs estruturados.
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Proteção contra execução privilegiada em hosts Unix/Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Compilador de arquivos .proto para gerar código Rust em tempo de build.
tonic-build = "0.11"
